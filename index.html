<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Change this: the text shown in the browser tab and in search results -->
  <title>My Website</title>
  <meta name="description" content="A short description of your site.">

  <style>
    /* ---- Colors and fonts: change these to restyle the whole page ---- */
    :root {
      --bg: #fafaf9;
      --text: #1c1917;
      --muted: #78716c;
      --accent: #2563eb;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header, main, footer {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px;
    }

    header { display: flex; justify-content: space-between; align-items: center; }
    header a { color: var(--text); text-decoration: none; font-weight: 600; }
    nav a { margin-left: 20px; font-weight: 400; color: var(--muted); }
    nav a:hover { color: var(--accent); }

    main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.15; margin-bottom: 16px; }
    p { color: var(--muted); font-size: 1.125rem; }

    footer { color: var(--muted); font-size: 0.875rem; }
  </style>
</head>
<body>

  <header>
    <a href="/">My Website</a>
    <nav>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Hello, world.</h1>
    <p>This site is live. Edit index.html to make it yours.</p>
  </main>

  <footer>
    &copy; <span id="year"></span> My Website
  </footer>

  <script>
    // Keeps the copyright year current automatically
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
